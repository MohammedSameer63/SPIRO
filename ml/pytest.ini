[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: unit tests (no GPU, no file I/O)
    integration: integration tests (may require dataset)
    slow: slow tests (training loops)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# =============================================================================
# SPIRO Unified Taxonomy — 109 Classes
# 7 Disposal Streams:
#   organic       — food/garden/biodegradable waste (compost/green bin)
#   recoverable   — clean recyclables (plastic, glass, metal, paper, cardboard)
#   non_recoverable — contaminated / mixed / residual waste (general bin)
#   hazardous     — chemicals, paint, fuel, sharp metal
#   sanitary      — medical, hygiene, bodily waste
#   e_waste       — electronics and batteries
#   reject        — unclassified, unknown, heavily mixed
# =============================================================================

taxonomy:
  version: "2.0.0"
  total_classes: 109
  streams: 7
  description: "SPIRO unified waste taxonomy — 7 disposal streams"

classes:

  # ─── PLASTIC ────────────────────────────────────────────────────────────────
  0:  plastic_bottle
  1:  plastic_bottle_cap
  2:  plastic_bag
  3:  plastic_film
  4:  plastic_straw
  5:  plastic_cup
  6:  plastic_lid
  7:  plastic_cutlery_fork
  8:  plastic_cutlery_knife
  9:  plastic_cutlery_spoon
  10: plastic_container
  11: plastic_tray
  12: plastic_packaging
  13: plastic_wrap
  14: plastic_tube
  15: plastic_rope
  16: plastic_toy
  17: plastic_hanger
  18: plastic_bucket
  19: polystyrene_cup

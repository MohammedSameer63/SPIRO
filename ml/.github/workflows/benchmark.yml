name: SPIRO ML ONNX Validation & Benchmark

on:
  workflow_dispatch:
    inputs:
      yolo_onnx:
        description: "Path to YOLOv11 ONNX (relative to repo)"
        required: false
        default: "models/exports/spiro_yolov11s_best.onnx"
      effnet_onnx:
        description: "Path to EfficientNetV2 ONNX"
        required: false
        default: "models/exports/spiro_effnetv2_s_best_effnet.onnx"
      run_benchmark:
        description: "Run benchmark (slow)"
        type: boolean
        default: false
  push:
    paths:
      - "models/exports/**"
  schedule:
    - cron: "0 2 * * 1"   # Weekly Monday 02:00 UTC

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: src

jobs:
  validate-onnx:
    name: ONNX Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install onnx onnxruntime numpy torch scipy scikit-learn \
                      pyyaml omegaconf opencv-python-headless timm
          pip install -e "."
      - name: Validate YOLO ONNX (if exists)
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'src')
          yolo = '${{ github.event.inputs.yolo_onnx }}'
          from pathlib import Path
          if not Path(yolo).exists():
              print(f'YOLO ONNX not found ({yolo}) — skipping')
              sys.exit(0)
          from lib.ml.mlops.validation.model_validator import ModelValidator
          v = ModelValidator(max_latency_ms=10000)
          r = v.validate(yolo, 'yolov11s', 'ci', input_size=640, task='detection')
          print(r.summary)
          sys.exit(0 if r.overall_passed else 1)
          "
        continue-on-error: true

      - name: Validate EffNet ONNX (if exists)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          effnet = '${{ github.event.inputs.effnet_onnx }}'
          from pathlib import Path
          if not Path(effnet).exists():
              print(f'EffNet ONNX not found ({effnet}) — skipping')
              sys.exit(0)
          from lib.ml.mlops.validation.model_validator import ModelValidator
          v = ModelValidator(max_latency_ms=10000)
          r = v.validate(effnet, 'effnetv2_s', 'ci', input_size=300, task='verification')
          print(r.summary)
          sys.exit(0 if r.overall_passed else 1)
          "
        continue-on-error: true

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: validate-onnx
    if: github.event.inputs.run_benchmark == 'true' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install onnxruntime numpy pyyaml omegaconf psutil
          pip install -e "."
      - name: Run preprocessing benchmark
        run: |
          python -c "
          import sys, numpy as np
          sys.path.insert(0, 'src')
          from lib.ml.pipeline.preprocessing.preprocessor import ImagePreprocessor
          import time
          prep = ImagePreprocessor(blur_threshold=0.0, quality_threshold=0.0)
          dummy = np.random.randint(30, 200, (640, 640, 3), dtype=np.uint8)
          # Warmup
          for _ in range(5): prep.process(dummy)
          times = []
          for _ in range(50):
              t0 = time.perf_counter()
              prep.process(dummy)
              times.append((time.perf_counter() - t0)*1000)
          print(f'Preprocessor: mean={sum(times)/len(times):.1f}ms')
          "
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: reports/
          if-no-files-found: ignore

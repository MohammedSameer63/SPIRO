name: SPIRO ML CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: src

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linters
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ training/ --ignore E501,E402

  # ── Unit tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov
          pip install onnx onnxruntime numpy opencv-python-headless \
                      pillow pyyaml omegaconf scipy scikit-learn \
                      torch torchvision timm albumentations
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src/lib/ml \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration" \
            --timeout=120

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unit
        continue-on-error: true

  # ── Taxonomy validation ───────────────────────────────────────────────────────
  taxonomy-check:
    name: Taxonomy Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: pip install pyyaml omegaconf numpy
      - name: Validate 109-class taxonomy
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from lib.ml.dataset_engineering.taxonomy import TaxonomyLoader
          tax = TaxonomyLoader()
          assert tax.num_classes == 109, f'Expected 109, got {tax.num_classes}'
          print(f'Taxonomy OK: {tax.num_classes} classes')
          "

  # ── Import validation ─────────────────────────────────────────────────────────
  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          pip install onnx onnxruntime numpy opencv-python-headless \
                      pyyaml omegaconf scipy scikit-learn torch timm \
                      albumentations
          pip install -e "."
      - name: Check all core imports
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from lib.ml.pipeline import SPIROPipeline, PipelineConfig
          from lib.ml.verification import VerifierModel, VerifyConfig, ConfidenceFusion
          from lib.ml.mlops import ModelRegistry, DatasetRegistry, ModelValidator
          from lib.ml.mlops import DriftDetector, ConceptDriftDetector
          from lib.ml.mlops import RetrainingScheduler, ContinuousLearningManager
          from lib.ml.optimization.onnx_optimizer import ONNXOptimizer
          from lib.ml.benchmarking.pipeline_benchmarker import PipelineBenchmarker
          from lib.ml.robustness.robustness_tester import RobustnessTester
          print('All imports OK')
          "

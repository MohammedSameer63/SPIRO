# =============================================================================
# TACO → SPIRO Mapping
# Source: TACO (Trash Annotations in Context)
# License: MIT
# URL: http://tacodataset.org
# Citation: Proença, P.F. & Simões, P. (2020). TACO: Trash Annotations in
#           Context for Litter Detection. arXiv:2003.06975
# =============================================================================
#
# TACO uses 60 categories. Each entry maps a TACO category name to one or
# more SPIRO class IDs.
# When a TACO category maps to multiple SPIRO classes the "primary" ID is
# used for single-label tasks; all IDs are available for multi-label.
#
# source_class: TACO category string (lowercase, as returned by TACO API)
# spiro_ids:   list of matching SPIRO class IDs (first = primary)
# notes:       rationale for ambiguous mappings
# =============================================================================

dataset:
  name: TACO
  version: "1.0"
  license: MIT
  homepage: "http://tacodataset.org"
  paper: "https://arxiv.org/abs/2003.06975"
  annotation_format: COCO
  checksum_file: "taco_checksums.json"

